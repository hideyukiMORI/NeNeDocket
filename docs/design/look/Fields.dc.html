<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>NeNe Docket 項目とプリセット</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; height: 900px; display: flex; flex-direction: column; overflow: hidden; font-family: 'Noto Sans JP', system-ui, sans-serif; font-size: 13px; background: #300A24; color: #EEEEEC">

<!-- タイトルバー -->
<div style="height: 40px; flex: none; display: flex; align-items: flex-end; background: #1E0516; padding-left: 8px">
<div style="height: 40px; display: flex; align-items: center; padding: 0 12px 0 6px">
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2.5" y="2.5" width="13" height="13" rx="3" fill="none" stroke="#E95420" stroke-width="1.6"></rect><path d="M5.5 7h7M5.5 10h7M5.5 13h4" stroke="#E95420" stroke-width="1.6" stroke-linecap="round"></path></svg>
</div>
<div style="height: 32px; padding: 0 14px; display: flex; align-items: center; color: #B8A9B3; font-size: 12.5px">全件</div>
<div style="height: 32px; padding: 0 14px; display: flex; align-items: center; color: #B8A9B3; font-size: 12.5px">定例 10/22</div>
<div style="height: 32px; min-width: 140px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 8px; border-radius: 6px 6px 0 0; background: #300A24; box-shadow: inset 0 -2px 0 #E95420; font-size: 12.5px; font-weight: 500">
<svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="2.2" fill="none" stroke="#B8A9B3" stroke-width="1.3"></circle><path d="M7 1v2M7 11v2M1 7h2M11 7h2M2.8 2.8l1.4 1.4M9.8 9.8l1.4 1.4M2.8 11.2l1.4-1.4M9.8 4.2l1.4-1.4" stroke="#B8A9B3" stroke-width="1.3" stroke-linecap="round"></path></svg>台帳の設定</div>
<div style="flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; color: #B8A9B3; font-size: 12px">総務部 業務改善プロジェクト 課題管理表</div>
<div style="display: flex; height: 40px; align-self: flex-start">
<button aria-label="最小化" style="width: 46px; height: 40px; border: 0; background: transparent; color: #B8A9B3; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" stroke="currentColor" stroke-width="1"></path></svg></button>
<button aria-label="最大化" style="width: 46px; height: 40px; border: 0; background: transparent; color: #B8A9B3; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"></rect></svg></button>
<button aria-label="閉じる" style="width: 46px; height: 40px; border: 0; background: transparent; color: #B8A9B3; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"></path></svg></button>
</div>
</div>

<div style="flex: 1; min-height: 0; display: flex">

<!-- 左の目次 -->
<nav aria-label="設定の目次" style="width: 220px; flex: none; padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; background: #2A0820; border-right: 1px solid #43183A">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
<a href="#" style="height: 34px; padding: 0 12px; border-radius: 6px; display: flex; align-items: center; gap: 10px; text-decoration: none; font-size: 13px; background: {{n.bg}}; color: {{n.fg}}; font-weight: {{n.weight}}">{{n.name}}</a>
</sc-for>
</nav>

<!-- 右の本体 -->
<div style="flex: 1; min-width: 0; overflow: auto; padding: 28px 40px 32px; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 22px; font-weight: 700">項目</h1>
<p style="margin: 0; color: #B8A9B3; font-size: 12.5px">台帳の全員に効きます。項目の種類は決まっていて、表に出すかどうかと表示名だけを変えられます。</p>
</div>
<div style="flex: 1"></div>
<div style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #B8A9B3">表に出す
<span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #EEEEEC; font-weight: 500">11 / 24</span>
<span style="width: 120px; height: 6px; border-radius: 3px; background: #4A1E3D; display: block; overflow: hidden"><span style="display: block; width: 46%; height: 6px; background: #E95420"></span></span>
</div>
</div>

<!-- プリセット -->
<section aria-label="プリセット" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px"><h2 style="margin: 0; font-size: 13px; font-weight: 700">プリセット</h2><span style="color: #B8A9B3; font-size: 12px">項目をまとめて表に出します。当てたあとに 1 つずつ外せます。</span></div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="5">
<button style="text-align: left; padding: 14px 14px 12px; border-radius: 8px; font: inherit; display: flex; flex-direction: column; gap: 6px; background: {{p.bg}}; color: #EEEEEC; border: 1px solid {{p.bd}}; box-shadow: {{p.ring}}">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700">{{p.name}}<span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #B8A9B3; font-weight: 400">{{p.n}} 列</span></span>
<span style="font-size: 11.5px; color: #B8A9B3; line-height: 1.6">{{p.cols}}</span>
<span style="font-size: 11px; color: {{p.tagFg}}">{{p.tag}}</span>
</button>
</sc-for>
</div>
</section>

<!-- カタログ -->
<section aria-label="項目の一覧" style="display: flex; flex-direction: column; border: 1px solid #43183A; border-radius: 8px; overflow: hidden">
<div style="height: 34px; display: grid; grid-template-columns: 64px minmax(160px, 1.2fr) 96px 96px minmax(160px, 1fr) 72px; align-items: center; column-gap: 12px; padding: 0 16px; background: #2A0820; color: #B8A9B3; font-size: 11.5px; font-weight: 500">
<span>表に出す</span><span>表示名</span><span>種類</span><span>由来</span><span>説明</span><span>幅</span>
</div>
<sc-for list="{{fields}}" as="f" hint-placeholder-count="14">
<sc-if value="{{f.head}}" hint-placeholder-val="{{ false }}">
<div style="height: 30px; display: flex; align-items: center; padding: 0 16px; background: #26071D; color: #B8A9B3; font-size: 11.5px; font-weight: 700; border-top: 1px solid #43183A">{{f.name}}</div>
</sc-if>
<sc-if value="{{f.row}}" hint-placeholder-val="{{ true }}">
<div style="height: 40px; display: grid; grid-template-columns: 64px minmax(160px, 1.2fr) 96px 96px minmax(160px, 1fr) 72px; align-items: center; column-gap: 12px; padding: 0 16px; border-top: 1px solid #43183A; color: {{f.fg}}">
<span><span role="img" aria-label="{{f.onLabel}}" style="width: 32px; height: 18px; border-radius: 9px; display: flex; align-items: center; padding: 2px; box-sizing: border-box; justify-content: {{f.knob}}; background: {{f.track}}"><span style="width: 14px; height: 14px; border-radius: 7px; background: #FFFFFF; display: block"></span></span></span>
<span><input aria-label="表示名" value="{{f.name}}" style="width: 100%; box-sizing: border-box; height: 28px; padding: 0 8px; border-radius: 5px; font: inherit; font-size: 12.5px; background: #3B1430; color: {{f.fg}}; border: 1px solid #5A2A4C"></span>
<span style="font-size: 12px; color: #B8A9B3">{{f.kind}}</span>
<span><span style="font-size: 11px; padding: 2px 8px; border-radius: 10px; background: {{f.srcBg}}; color: {{f.srcFg}}">{{f.src}}</span></span>
<span style="font-size: 11.5px; color: #B8A9B3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{f.note}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #B8A9B3">{{f.w}}</span>
</div>
</sc-if>
</sc-for>
</section>

</div>
</div>

<!-- ステータスバー -->
<div style="height: 28px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 12px; background: #26071D; color: #B8A9B3; font-size: 11.5px">
<span>変更は台帳の全員に 3 秒ほどで届きます</span>
<div style="flex: 1"></div>
<span>森（持ち主）</span>
<span>日本語</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const nav = ['表示', '項目', '状態', 'ビュー', '参加者と権限', '言語と配色'].map((n) => ({
      name: n, bg: n === '項目' ? '#4A1E3D' : 'transparent', fg: n === '項目' ? '#EEEEEC' : '#B8A9B3', weight: n === '項目' ? 500 : 400
    }));
    const presetDefs = [
      ['基本', 7, 'No・課題・担当・期限・ステータス・対応策・備考', '日本の最小構成', false],
      ['業務改善', 9, '起票日・課題・詳細・ステータス・解決策・備考・担当・期限', 'いまの台帳', true],
      ['PM 強化', 11, '分類・優先度・担当部署・完了日を足す', '', false],
      ['障害・原因分析', 12, '発生日・原因・真因・再発防止策・確認者', '障害管理表・8D', false],
      ['QA', 10, '質問者・回答・回答期限・確認', 'QA 管理表', false]
    ];
    const presets = presetDefs.map((p) => ({
      name: p[0], n: p[1], cols: p[2], tag: p[4] ? '● 当てている' : p[3],
      tagFg: p[4] ? '#F6B49A' : '#B8A9B3',
      bg: p[4] ? 'rgba(233,84,32,0.12)' : '#3B1430', bd: p[4] ? '#E95420' : '#5A2A4C', ring: p[4] ? '0 0 0 1px #E95420' : 'none'
    }));
    const on = (name, kind, src, note, w, isOn) => ({
      row: true, head: false, name, kind, src, note, w,
      fg: isOn ? '#EEEEEC' : '#B8A9B3', onLabel: isOn ? '表に出す: はい' : '表に出す: いいえ',
      knob: isOn ? 'flex-end' : 'flex-start', track: isOn ? '#E95420' : '#5A2A4C',
      srcBg: src === 'カタログ' ? 'rgba(215,196,229,0.12)' : (src === '自動' ? 'rgba(95,184,120,0.14)' : '#4A1E3D'),
      srcFg: src === 'カタログ' ? '#D7C4E5' : (src === '自動' ? '#9AD6A9' : '#EEEEEC')
    });
    const head = (name) => ({ head: true, row: false, name });
    const fields = [
      head('核の項目'),
      on('課題', '短文', '核', '題名。表の左に固定', '1fr', true),
      on('課題の詳細', '長文', '核', '本文。表では 2 行目に要約', '—', true),
      on('ステータス', '状態', '核', '区分 6 つ・名前は「状態」で変える', '92', true),
      on('担当', '短文', '核', '', '52', true),
      on('期限', '日付', '核', '過ぎると ⚠ と橙', '76', true),
      head('自動の項目（ジャーナルから導く）'),
      on('起票日', '日付', '自動', '最初の操作の日付', '52', true),
      on('起票者', '短文', '自動', '最初の操作のアカウント', '52', false),
      on('完了日', '日付', '自動', '最後に「完了」へ移した日', '48', true),
      head('カタログ'),
      on('分類', '選択', 'カタログ', '業務・IT・総務', '48', true),
      on('優先度', '選択', 'カタログ', '高・中・低（高は橙）', '44', true),
      on('解決策', '長文', 'カタログ', '対応策の呼び名を変えた', '—', true),
      on('原因', '長文', 'カタログ', '', '—', false),
      on('確認者', '短文', 'カタログ', '確認中から完了へ移す人', '52', false),
      on('回答期限', '日付', 'カタログ', '', '76', false)
    ];
    return { nav, presets, fields };
  }
}
</script>
</body>
</html>
