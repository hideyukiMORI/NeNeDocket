<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>NeNe Docket 台帳を始める</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; height: 900px; display: flex; flex-direction: column; overflow: hidden; font-family: 'Noto Sans JP', system-ui, sans-serif; font-size: 13px; background: #300A24; color: #EEEEEC">

<div style="height: 40px; flex: none; display: flex; align-items: flex-end; background: #1E0516; padding-left: 8px">
<div style="height: 40px; display: flex; align-items: center; padding: 0 12px 0 6px">
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2.5" y="2.5" width="13" height="13" rx="3" fill="none" stroke="#E95420" stroke-width="1.6"></rect><path d="M5.5 7h7M5.5 10h7M5.5 13h4" stroke="#E95420" stroke-width="1.6" stroke-linecap="round"></path></svg>
</div>
<div style="height: 32px; min-width: 140px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; border-radius: 6px 6px 0 0; background: #300A24; box-shadow: inset 0 -2px 0 #E95420; font-size: 12.5px; font-weight: 500">はじめに</div>
<div style="flex: 1"></div>
<div style="display: flex; height: 40px; align-self: flex-start">
<button aria-label="最小化" style="width: 46px; height: 40px; border: 0; background: transparent; color: #B8A9B3; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" stroke="currentColor" stroke-width="1"></path></svg></button>
<button aria-label="最大化" style="width: 46px; height: 40px; border: 0; background: transparent; color: #B8A9B3; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"></rect></svg></button>
<button aria-label="閉じる" style="width: 46px; height: 40px; border: 0; background: transparent; color: #B8A9B3; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"></path></svg></button>
</div>
</div>

<div style="flex: 1; min-height: 0; overflow: auto; display: flex; justify-content: center">
<div style="width: 100%; max-width: 1080px; padding: 56px 40px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px">

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.18em; color: #E95420">NENE DOCKET</span>
<h1 style="margin: 0; font-size: 28px; font-weight: 700">課題管理表を始める</h1>
<p style="margin: 0; color: #B8A9B3; font-size: 13.5px">台帳はフォルダです。ローカルでも、共有フォルダや NAS でも同じように使えます。</p>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<button style="text-align: left; padding: 20px; border-radius: 10px; font: inherit; color: #EEEEEC; background: #3B1430; border: 1px solid #5A2A4C; display: flex; gap: 16px; align-items: flex-start">
<span style="width: 36px; height: 36px; border-radius: 8px; flex: none; display: flex; align-items: center; justify-content: center; background: rgba(233,84,32,0.18)"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 5.5a1.5 1.5 0 0 1 1.5-1.5h3.5l1.5 2h6a1.5 1.5 0 0 1 1.5 1.5v6.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 2 14z" fill="none" stroke="#E95420" stroke-width="1.4" stroke-linejoin="round"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; font-weight: 700">共有されている台帳を開く</span><span style="font-size: 12.5px; color: #B8A9B3">フォルダを選ぶ。最近: \\LinkStation\share\業務改善</span></span>
<span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #B8A9B3">Ctrl+O</span>
</button>
<button style="text-align: left; padding: 20px; border-radius: 10px; font: inherit; color: #EEEEEC; background: #3B1430; border: 1px solid #5A2A4C; display: flex; gap: 16px; align-items: flex-start">
<span style="width: 36px; height: 36px; border-radius: 8px; flex: none; display: flex; align-items: center; justify-content: center; background: rgba(95,184,120,0.16)"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 2.5h8l4 4v9H3z M11 2.5v4h4" fill="none" stroke="#9AD6A9" stroke-width="1.4" stroke-linejoin="round"></path><path d="M6 10h6M6 12.5h4" stroke="#9AD6A9" stroke-width="1.4" stroke-linecap="round"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; font-weight: 700">Excel の課題管理表から取り込む</span><span style="font-size: 12.5px; color: #B8A9B3">CSV（Shift_JIS も）。列を項目に割り当て、No・起票日・完了日を保つ</span></span>
<span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #B8A9B3">Ctrl+I</span>
</button>
</div>

<section aria-label="新しい台帳の型" style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; gap: 10px"><h2 style="margin: 0; font-size: 15px; font-weight: 700">新しい台帳を作る</h2><span style="font-size: 12.5px; color: #B8A9B3">型を選ぶと、表に出す項目がそろいます。あとから設定で足し引きできます。</span></div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="5">
<button style="text-align: left; padding: 0; border-radius: 10px; overflow: hidden; font: inherit; color: #EEEEEC; background: #3B1430; border: 1px solid {{p.bd}}; box-shadow: {{p.ring}}; display: flex; flex-direction: column">
<span style="height: 92px; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 5px; background: #2A0820; border-bottom: 1px solid #5A2A4C">
<sc-for list="{{p.bars}}" as="b" hint-placeholder-count="5"><span style="display: flex; gap: 4px"><span style="height: 7px; border-radius: 2px; width: {{b.w1}}; background: #5A2A4C; display: block"></span><span style="height: 7px; border-radius: 2px; flex: 1; background: #4A1E3D; display: block"></span><span style="height: 7px; border-radius: 2px; width: 18px; background: {{b.c}}; display: block"></span></span></sc-for>
</span>
<span style="padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; font-weight: 700">{{p.name}}</span>
<span style="font-size: 11.5px; color: #B8A9B3; line-height: 1.6">{{p.cols}}</span>
</span>
</button>
</sc-for>
</div>
</section>

<div style="display: flex; align-items: center; gap: 12px; padding-top: 4px">
<label style="display: flex; align-items: center; gap: 10px; flex: 1; height: 38px; padding: 0 12px; border-radius: 6px; background: #3B1430; border: 1px solid #5A2A4C; color: #B8A9B3; font-size: 12.5px">置き場所
<input aria-label="台帳のフォルダ" value="\\LinkStation\share\業務改善2" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #EEEEEC; font-family: 'JetBrains Mono', monospace; font-size: 12.5px">
<span style="color: #EEEEEC">選ぶ…</span>
</label>
<button style="height: 38px; padding: 0 20px; border-radius: 6px; border: 0; font: inherit; font-size: 13.5px; font-weight: 700; background: #E95420; color: #FFFFFF">「業務改善」で作る</button>
</div>

</div>
</div>

<div style="height: 28px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 12px; background: #26071D; color: #B8A9B3; font-size: 11.5px">
<span>森 · ID 9fcb…c747</span>
<div style="flex: 1"></div>
<span><span style="color: #EEEEEC">Ctrl+O</span> 開く</span><span><span style="color: #EEEEEC">Ctrl+I</span> 取り込む</span><span><span style="color: #EEEEEC">F1</span> ヘルプ</span><span>日本語</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (n, c) => Array.from({ length: n }, (_, i) => ({ w1: i === 0 ? '28px' : '22px', c: i === 1 ? '#E95420' : (i === 3 ? '#D7C4E5' : '#5A2A4C') }));
    const defs = [
      ['基本', 'No・課題・担当・期限・ステータス・対応策・備考', false],
      ['業務改善', '起票日・詳細・解決策・備考を足す', true],
      ['PM 強化', '分類・優先度・担当部署・完了日', false],
      ['障害・原因分析', '原因・真因・再発防止策・確認者', false],
      ['QA', '質問者・回答・回答期限・確認', false]
    ];
    const presets = defs.map((d, i) => ({
      name: d[0], cols: d[1], bars: mk(5, 0),
      bd: d[2] ? '#E95420' : '#5A2A4C', ring: d[2] ? '0 0 0 1px #E95420' : 'none'
    }));
    return { presets };
  }
}
</script>
</body>
</html>
