[package]
name = "nene-docket"
description = "A small, fast issue tracker for Windows and X11. No server, no toolkit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# 配布は GitHub Release のバイナリ。crates.io には出さない。
publish = false

[[bin]]
name = "nene-docket"
path = "src/main.rs"

[lints]
workspace = true

# 🔴 合成ルートだけが全クレートを見る（ARC-002 / ARC-006）。外部 crate はここに書かない。
#    OS ごとの画面とアダプタは target の節で選ぶ（ADR 0002 / 0009）。
[dependencies]
nene-docket-application = { path = "../application" }
nene-docket-core = { path = "../core" }
nene-docket-store = { path = "../store" }

[target.'cfg(not(windows))'.dependencies]
nene-docket-adapters-x11 = { path = "../adapters-x11" }
nene-docket-ui-x11 = { path = "../ui-x11" }

[target.'cfg(windows)'.dependencies]
nene-docket-adapters-windows = { path = "../adapters-windows" }
nene-docket-ui-win32 = { path = "../ui-win32" }
