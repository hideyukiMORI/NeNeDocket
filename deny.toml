# cargo-deny — 依存の許可制を機械が見る（ARC-013 / ADR 0002）。
#
# 🔴 検査の入口は `make deny`（`make check` に含まれる）。CI 側にだけ検査を書かない（QLT-005）。
# 🔴 ここを緩める変更は ADR を要する（QLT-010）。
[graph]
all-features = true

[advisories]
version = 2
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
version = 2
# 🔴 実際に使っているライセンスだけを書く。`make deny` は `--deny license-not-encountered` を
#    付けて走るので、使っていないライセンスをここに書くと落ちる。
#    現在の実測（Issue #5・`cargo deny list`・2026-10-21）:
#      MIT — nene-docket の全クレート・cairo-rs・cairo-sys-rs・x11rb ほか（MIT OR Apache-2.0 の二重も MIT 側で数える）
#      Apache-2.0 — x11rb / x11rb-protocol / bitflags / libc / system-deps など（MIT との二重）
#      Apache-2.0 WITH LLVM-exception — rustix / linux-raw-sys / target-lexicon（三重）
#      Unicode-3.0 — unicode-ident（windows の手続きマクロ windows-implement / windows-interface が引く syn の下。
#        "(MIT OR Apache-2.0) AND Unicode-3.0" で、Unicode の文字表のデータに付く許諾。Issue #22・2026-10-21 実測・ADR 0009）
#      BSD-3-Clause — ed25519-dalek / curve25519-dalek / subtle（署名と検証。Issue #29・2026-10-21 実測・ADR 0010）
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-3-Clause"]
confidence-threshold = 0.8

[bans]
# 同じクレートの複数版を許さない。単一バイナリで配る前提に対して、重複は「どちらが効いているか分からない」を持ち込む。
multiple-versions = "deny"
wildcards = "deny"
# 内部クレート（publish = false）の path 依存は版を持たないが、workspace の 1 つに解決するので
# 「どれが効いているか分からない」は起こらない。外部 crate の `*` は上の wildcards が今まで通り拒む。
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
